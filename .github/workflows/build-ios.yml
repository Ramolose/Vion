name: Build Vion iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Force update all submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Install build tools and Boost
        run: |
          brew install cmake ninja boost

      - name: Configure CMake for iOS
        run: |
          BOOST_PREFIX=$(brew --prefix boost)
          echo "Boost prefix: $BOOST_PREFIX"

          # Patch des contraintes de version stricte de Boost dans CMakeLists
          sed -i '' 's/1.81 EXACT//g' CMakeLists.txt || true
          sed -i '' 's/1.81//g' CMakeLists.txt || true

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_FIND_ROOT_PATH="$BOOST_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_PREFIX_PATH="$BOOST_PREFIX;$BOOST_PREFIX/lib/cmake;$BOOST_PREFIX/lib/cmake/Boost-1.92.0" \
            -DBoost_INCLUDE_DIR="$BOOST_PREFIX/include" \
            -DBOOST_INCLUDEDIR="$BOOST_PREFIX/include" \
            -DBoost_NO_SYSTEM_PATHS=OFF

      - name: Compile with Xcode
        run: |
          PROJECT_FILE=$(find build -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Projet Xcode détecté : $PROJECT_FILE"

          # Récupération automatique du scheme principal
          SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          echo "Scheme ciblé : $SCHEME_NAME"

          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Aucun fichier .app n'a été trouvé."
            exit 1
          fi

          echo "Application trouvée : $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Vion.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-iOS-IPA
          path: Vion.ipa
          retention-days: 7
