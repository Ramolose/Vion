name: Build Vion iOS (.deb)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Select latest Xcode (Swift 6 requires Xcode 16+)
        run: |
          LATEST_XCODE=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$LATEST_XCODE" ]; then
            LATEST_XCODE="/Applications/Xcode.app"
          fi
          echo "Using $LATEST_XCODE"
          sudo xcode-select -s "$LATEST_XCODE"
          xcodebuild -version

      - name: Install Build Dependencies
        run: |
          brew install cmake ninja boost

      - name: Configure CMake for iOS
        run: |
          BOOST_PREFIX=$(brew --prefix boost)
          echo "Boost prefix: $BOOST_PREFIX"

          # Use the system python3 shipped with Xcode/macOS rather than Homebrew's,
          # since the CMake Python3 module can pick up an incompatible Homebrew build.
          SYSTEM_PYTHON="/usr/bin/python3"
          echo "Python cible : $SYSTEM_PYTHON"

          # Resolve the actual SDK path rather than passing the bare SDK name
          # "iphoneos": the Xcode generator can resolve a short name on its own,
          # but external/unicorn's CMakeLists.txt forwards ${CMAKE_OSX_SYSROOT}
          # verbatim to `clang -isysroot` inside a raw qemu/configure shell
          # invocation, which needs a real directory ("no such sysroot
          # directory: 'iphoneos'" otherwise, cascading into every platform
          # detection check in that script failing).
          IPHONEOS_SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "iphoneos SDK path: $IPHONEOS_SDK_PATH"

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$IPHONEOS_SDK_PATH" \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_SYSTEM_PROCESSOR="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DPython3_EXECUTABLE="$SYSTEM_PYTHON" \
            -DPYTHON_EXECUTABLE="$SYSTEM_PYTHON" \
            -DCAPSTONE_BUILD_TESTS=OFF \
            -DCAPSTONE_BUILD_PACKAGES=OFF \
            -DCMAKE_FIND_ROOT_PATH="$BOOST_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_PREFIX_PATH="$BOOST_PREFIX" \
            -DBoost_INCLUDE_DIR="$BOOST_PREFIX/include" \
            -DBOOST_INCLUDEDIR="$BOOST_PREFIX/include" \
            -DBoost_NO_SYSTEM_PATHS=OFF \
            --log-level=STATUS

      - name: Compile with Xcode
        run: |
          PROJECT_FILE=$(find build -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Projet trouve : $PROJECT_FILE"

          xcodebuild -project "$PROJECT_FILE" -list

          # "Vion" is the iOS app target defined in vita3k/gui-ios/CMakeLists.txt.
          SCHEME_NAME="Vion"

          echo "Compilation du scheme : $SCHEME_NAME"

          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Install packaging tools
        run: |
          # dpkg-deb builds the .deb; ldid ad-hoc "fake-signs" the binary so
          # it has a valid Mach-O signature load command. A jailbroken
          # device doesn't enforce AMFI/code-signing validation the way a
          # normal iOS install does, but the binary still needs *a*
          # signature (even a bogus one) to load at all - a real Apple
          # developer certificate is not required.
          brew install dpkg ldid

      - name: Package .deb
        run: |
          APP_PATH=$(find derived_data -name "Vion.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Aucun bundle .app n'a ete produit."
            exit 1
          fi

          echo "Bundle trouve : $APP_PATH"

          PKG_ID="com.antique.vion"
          PKG_VERSION="1.0"
          STAGE_DIR="deb-root"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR/DEBIAN" "$STAGE_DIR/Applications"
          cp -R "$APP_PATH" "$STAGE_DIR/Applications/Vion.app"

          # Ad-hoc sign the main executable (and any embedded frameworks)
          # so the Mach-O signature load command is present.
          ldid -S "$STAGE_DIR/Applications/Vion.app/Vion"
          find "$STAGE_DIR/Applications/Vion.app/Frameworks" -maxdepth 1 -name "*.framework" -type d 2>/dev/null | while read -r framework; do
            fw_name=$(basename "$framework" .framework)
            if [ -f "$framework/$fw_name" ]; then
              ldid -S "$framework/$fw_name"
            fi
          done

          cat > "$STAGE_DIR/DEBIAN/control" <<EOF
Package: $PKG_ID
Name: Vion
Version: $PKG_VERSION
Architecture: iphoneos-arm64
Description: Vion (Vita3K-based PS Vita emulator) for jailbroken iOS
Maintainer: Vion
Section: Applications
Depends: firmware (>= 16.0)
EOF

          # Registers the app icon/springboard entry after install, and
          # removes it on uninstall. uicache ships with Sileo/Zebra on
          # jailbroken devices.
          cat > "$STAGE_DIR/DEBIAN/postinst" <<'EOF'
#!/bin/sh
uicache -p /Applications/Vion.app || true
EOF
          cat > "$STAGE_DIR/DEBIAN/postrm" <<'EOF'
#!/bin/sh
uicache -u /Applications/Vion.app || true
EOF
          chmod 755 "$STAGE_DIR/DEBIAN/postinst" "$STAGE_DIR/DEBIAN/postrm"

          dpkg-deb --root-owner-group --build "$STAGE_DIR" Vion.deb

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-iOS-deb
          path: Vion.deb
          retention-days: 7
