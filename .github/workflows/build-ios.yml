name: Build Vion iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew install cmake ninja

      - name: Configure CMake for iOS
        run: |
          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0

      - name: Compile with Xcode
        run: |
          # Compilation du projet sans exiger de compte développeur payant
          xcodebuild build \
            -project $(find build -maxdepth 2 -name "*.xcodeproj" | head -n 1) \
            -scheme Vion \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package to IPA
        run: |
          # Localise le dossier .app généré
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)
          
          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Aucun fichier .app n'a été trouvé."
            exit 1
          fi

          echo "App trouvée : $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Vion.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-iOS-IPA
          path: Vion.ipa
          retention-days: 7
