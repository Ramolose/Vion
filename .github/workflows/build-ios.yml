name: Build Vion iOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Git and Fetch Submodules
        run: |
          # Forcer HTTPS pour tous les sous-modules
          git config --global url."https://github.com/".insteadOf git://github.com/
          git config --global url."https://github.com/".insteadOf git@github.com:
          
          # Initialisation pas à pas pour ne pas interrompre le job si un sous-module secondaire échoue
          git submodule sync --recursive
          git submodule update --init --recursive || true

      - name: Patch Submodule Checks and Boost
        run: |
          # Neutraliser l'arrêt forcé de check_submodules_present dans external/CMakeLists.txt
          if [ -f "external/CMakeLists.txt" ]; then
            sed -i '' 's/check_submodules_present(/# check_submodules_present(/g' external/CMakeLists.txt || true
          fi

          # Neutraliser les versions rigides de Boost dans CMakeLists.txt
          sed -i '' 's/1.81 EXACT//g' CMakeLists.txt || true
          sed -i '' 's/1.81//g' CMakeLists.txt || true

      - name: Install Build Dependencies
        run: |
          brew install cmake ninja boost

      - name: Configure CMake for iOS
        run: |
          BOOST_PREFIX=$(brew --prefix boost)
          echo "Boost prefix: $BOOST_PREFIX"

          cmake \
            -S . \
            -B build \
            -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0 \
            -DCMAKE_FIND_ROOT_PATH="$BOOST_PREFIX" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_INCLUDE=BOTH \
            -DCMAKE_FIND_ROOT_PATH_MODE_LIBRARY=BOTH \
            -DCMAKE_PREFIX_PATH="$BOOST_PREFIX;$BOOST_PREFIX/lib/cmake;$BOOST_PREFIX/lib/cmake/Boost-1.92.0" \
            -DBoost_INCLUDE_DIR="$BOOST_PREFIX/include" \
            -DBOOST_INCLUDEDIR="$BOOST_PREFIX/include" \
            -DBoost_NO_SYSTEM_PATHS=OFF

      - name: Compile with Xcode
        run: |
          PROJECT_FILE=$(find build -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Projet trouvé : $PROJECT_FILE"

          # Liste les schemes disponibles
          xcodebuild -project "$PROJECT_FILE" -list

          # Sélectionne le scheme principal (Vion ou Vita3K)
          SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | grep -E 'Vion|Vita3K' | head -n 1)
          
          if [ -z "$SCHEME_NAME" ]; then
            SCHEME_NAME=$(xcodebuild -project "$PROJECT_FILE" -list | awk '/Schemes:/{flag=1;next}/^$/{flag=0}flag' | tr -d ' ' | head -n 1)
          fi

          echo "Compilation du scheme : $SCHEME_NAME"

          xcodebuild build \
            -project "$PROJECT_FILE" \
            -scheme "$SCHEME_NAME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath derived_data \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          APP_PATH=$(find derived_data -name "*.app" -type d | head -n 1)

          if [ -z "$APP_PATH" ]; then
            echo "Erreur : Aucun bundle .app n'a été produit par la compilation."
            exit 1
          fi

          echo "Bundle trouvé : $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r Vion.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vion-iOS-IPA
          path: Vion.ipa
          retention-days: 7
